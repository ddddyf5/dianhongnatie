<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18th Century Letter</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#f0f0f0;
  padding:30px 10px;
  font-family:serif;
}
.wrap{
  max-width:600px;
  margin:0 auto;
}
.letter-card{
  width:100%;
  min-height:1200px;
  background-color:#e8ddc8;
  background-image:
    url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
  padding:80px 70px;
  position:relative;
  border-radius:2px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.22);
  overflow:hidden;
}
/* 纸张边缘磨损 */
.letter-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center,transparent 72%,rgba(120,100,70,0.18) 100%);
  pointer-events:none;
}
/* 泥土污渍、霉斑，只在边角，正文保持干净 */
.letter-card::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 3% 4%, rgba(90,70,40,0.22) 0%, transparent 7%),
    radial-gradient(circle at 96% 92%, rgba(80,60,35,0.16) 0%, transparent 9%),
    radial-gradient(circle at 8% 94%, rgba(110,90,60,0.13) 0%, transparent 6%),
    radial-gradient(circle at 92% 6%, rgba(75,55,30,0.11) 0%, transparent 5%),
    radial-gradient(circle at 15% 85%, rgba(100,80,55,0.09) 0%, transparent 4%),
    radial-gradient(circle at 88% 20%, rgba(95,75,48,0.10) 0%, transparent 4%);
  pointer-events:none;
}
/* 火漆印章 */
.seal{
  position:absolute;
  bottom:60px;
  right:50px;
  width:110px;
  height:110px;
  border-radius:50%;
  background:radial-gradient(circle, #702828 0%, #4b1818 100%);
  opacity:0.72;
  filter:blur(1px);
}
.text-area{
  position:relative;
  z-index:2;
  color:#2c241c;
  font-family:"Times New Roman", Georgia, serif;
  font-size:19px;
  line-height:1.85;
}
.letter-header{
  font-family:Georgia, serif;
  font-style:italic;
  text-align:right;
  margin-bottom:32px;
  font-size:18px;
}
.letter-body p{
  margin-bottom:18px;
  text-indent:2em;
}
.letter-footer{
  margin-top:40px;
  text-align:right;
  font-style:italic;
}
.export-btn{
  margin:24px auto 0;
  display:block;
  padding:12px 26px;
  font-size:17px;
  background:#44382c;
  color:#f1e9da;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.export-btn:hover{background:#332a20;}
</style>
</head>
<body>
<div class="wrap">
  <div class="letter-card" id="capture">
    <div class="seal"></div>
    <div class="text-area">
      <div class="letter-header">
        London, 14th July, 1762
      </div>
      <div class="letter-body">
        <p>
          这里替换成你的信件正文。纸张带着岁月沉淀的泛黄质感，边角沾染淡淡的泥土痕迹，仿佛这封书信曾被长久收纳在木箱之中。羽毛笔落下的字迹沉静柔和，墨色不是纯黑，是深炭褐色。
        </p>
        <p>
          你可以自由修改这一段文字，所有样式不会改动。污渍只分布在页面四角，正文区域清晰可读，不会遮挡文字。
        </p>
        <p>
          书写时行间距宽松，模仿18世纪欧洲贵族手写信的排版风格。整体色调低饱和，复古沉静，没有任何现代元素。
        </p>
      </div>
      <div class="letter-footer">
        Yours sincerely<br>
        —————
      </div>
    </div>
  </div>
  <button class="export-btn" id="exportBtn">导出图片 PNG</button>
</div>

<script>
const exportBtn = document.getElementById("exportBtn");
const captureDom = document.getElementById("capture");

async function exportAsImage(){
  try{
    const canvas = await html2canvas(captureDom, {
      useCORS:true,
      scale:2,
      backgroundColor:null
    });
    const imgUrl = canvas.toDataURL("image/png",1.0);
    const a = document.createElement("a");
    a.href = imgUrl;
    a.download = "18th-century-letter.png";
    a.click();
  }catch(err){
    alert("导出失败："+err.message);
  }
}
exportBtn.addEventListener("click",exportAsImage);
</script>
</body>
</html>
